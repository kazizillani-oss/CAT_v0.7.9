[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
# Mirror of the root pyproject.toml (which is the canonical config).
# Prefer installing from the repository root (`pip install .` there).
# Kept in sync so `pip install ./CAT_v0.7.4` also works.
# Distribution name `cct-cli` (no exact PyPI match, checked 2026-09-21;
# bare `cat` is TAKEN — dist is `cct-cli`, command is `cat`.
# (`cat-cli` was rejected at upload by PyPI's similarity check vs `catcli`.)
name = "cct-cli"
version = "0.8.b"
description = "CAT CLI v0.8.b [beta version] — Coding Agent Terminal / terminal AI coding agent"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE*"]
authors = [
    { name = "Kazi Zillani" }
]
keywords = ["cat", "cct-cli", "cct", "ai", "agent", "terminal", "tui", "cli", "coding-agent"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "textual[syntax]>=0.60",
    "rich>=13.0",
    "colorama>=0.4.6; sys_platform == 'win32'",
    "requests>=2.31.0",
    "watchdog>=4.0",
    "plyer>=2.1",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "pydantic>=2.0",
    "python-multipart>=0.0.6",
]
science = [
    "sympy>=1.12",
    "matplotlib>=3.7",
    "numpy>=1.24",
    "reportlab>=4.0",
    "pyperclip>=1.8.2",
    "prompt_toolkit>=3.0.43",
]
host = [
    "PySide6>=6.6",
]
browser = [
    "PySide6>=6.6",
    "pywebview>=4.4",
    "playwright>=1.40",
]
all = [
    "cct-cli[web,science,browser]",
]

[project.urls]
Homepage = "https://github.com/kazizillani-oss/CAT_v0.7.9"
Repository = "https://github.com/kazizillani-oss/CAT_v0.7.9"
Issues = "https://github.com/kazizillani-oss/CAT_v0.7.9/issues"
Changelog = "https://github.com/kazizillani-oss/CAT_v0.7.9/blob/main/CAT_v0.7.4/CHANGELOG_v0.7.9.md"

[project.scripts]
cat = "calc_terminal.cli:main"
catx = "calc_terminal.cli:main"
cct = "calc_terminal.cli:main"

[tool.setuptools.packages.find]
include = ["calc_terminal*"]
exclude = ["calc_terminal.tests*"]

# Non-.py resources that MUST ship inside the wheel/sdist: first-run
# seeding copies these into the user's app-data dir (first_run.py).
[tool.setuptools.package-data]
"calc_terminal" = ["cat.ico", "*.ico"]
"calc_terminal.models" = ["*.json"]
"calc_terminal.providers" = ["*.json"]
"calc_terminal.web" = [
    "static/*",
    "static/**/*",
    "static/css/*",
    "static/js/*",
    "static/icons/*",
]
