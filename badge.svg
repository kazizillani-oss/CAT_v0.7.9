<svg xmlns="http://www.w3.org/2000/svg" width="820" height="180" viewBox="0 0 820 180">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1b2e"/>
      <stop offset="100%" style="stop-color:#16172b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7aa2f7"/>
      <stop offset="50%" style="stop-color:#bb9af7"/>
      <stop offset="100%" style="stop-color:#7dcfff"/>
    </linearGradient>
  </defs>

  <!-- Background with rounded corners -->
  <rect width="820" height="180" rx="16" ry="16" fill="url(#bg)"/>

  <!-- Subtle border -->
  <rect width="820" height="180" rx="16" ry="16" fill="none" stroke="#2a2b3d" stroke-width="1.5"/>

  <!-- Accent line at top -->
  <rect x="0" y="0" width="820" height="3" rx="16" fill="url(#accent)" opacity="0.8"/>

  <!-- Terminal dots (macOS style) -->
  <circle cx="30" cy="22" r="5" fill="#ff5f57" opacity="0.9"/>
  <circle cx="48" cy="22" r="5" fill="#febc2e" opacity="0.9"/>
  <circle cx="66" cy="22" r="5" fill="#28c840" opacity="0.9"/>

  <!-- Cat ears (stylized) -->
  <g transform="translate(48, 55)">
    <!-- Left ear -->
    <polygon points="0,55 15,10 30,55" fill="#7aa2f7" opacity="0.15"/>
    <polygon points="5,55 15,18 25,55" fill="#7aa2f7" opacity="0.25"/>
    <!-- Right ear -->
    <polygon points="50,55 65,10 80,55" fill="#bb9af7" opacity="0.15"/>
    <polygon points="55,55 65,18 75,55" fill="#bb9af7" opacity="0.25"/>
  </g>

  <!-- CAT ASCII Art -->
  <text x="165" y="70" font-family="monospace" font-size="13" fill="#7aa2f7" letter-spacing="0.5">
    <tspan x="165" dy="0"> ██████╗  █████╗ ████████╗</tspan>
    <tspan x="165" dy="15">██╔════╝██╔══██╗╚══██╔══╝</tspan>
    <tspan x="165" dy="15">██║     ███████║   ██║</tspan>
    <tspan x="165" dy="15">██║     ██╔══██║   ██║</tspan>
    <tspan x="165" dy="15">╚██████╗██║  ██║   ██║</tspan>
    <tspan x="165" dy="15"> ╚═════╝╚═╝  ╚═╝   ╚═╝</tspan>
  </text>

  <!-- Main Title -->
  <text x="480" y="65" font-family="sans-serif" font-size="28" font-weight="700" fill="#c0caf5" letter-spacing="-0.5">
    Coding Agent Terminal
  </text>

  <!-- Subtitle -->
  <text x="480" y="92" font-family="sans-serif" font-size="14" fill="#565f89" letter-spacing="0.3">
    Terminal-first AI development environment
  </text>

  <!-- Version badge -->
  <g transform="translate(480, 108)">
    <rect width="72" height="22" rx="4" fill="#1e2030"/>
    <rect width="72" height="22" rx="4" fill="none" stroke="#3b3d57" stroke-width="0.8"/>
    <text x="36" y="15" font-family="monospace" font-size="11" fill="#7aa2f7" text-anchor="middle">v0.8.0b1</text>
  </g>

  <!-- Beta tag -->
  <g transform="translate(560, 108)">
    <rect width="46" height="22" rx="4" fill="#bb9af7" opacity="0.15"/>
    <rect width="46" height="22" rx="4" fill="none" stroke="#bb9af7" stroke-width="0.6" opacity="0.5"/>
    <text x="23" y="15" font-family="sans-serif" font-size="10" fill="#bb9af7" text-anchor="middle" font-weight="600">BETA</text>
  </g>

  <!-- Python badge -->
  <g transform="translate(614, 108)">
    <rect width="68" height="22" rx="4" fill="#1e2030"/>
    <rect width="68" height="22" rx="4" fill="none" stroke="#3b3d57" stroke-width="0.8"/>
    <text x="34" y="15" font-family="monospace" font-size="10" fill="#9ece6a" text-anchor="middle">Py 3.10+</text>
  </g>

  <!-- MIT badge -->
  <g transform="translate(690, 108)">
    <rect width="48" height="22" rx="4" fill="#1e2030"/>
    <rect width="48" height="22" rx="4" fill="none" stroke="#3b3d57" stroke-width="0.8"/>
    <text x="24" y="15" font-family="monospace" font-size="10" fill="#9ece6a" text-anchor="middle">MIT</text>
  </g>

  <!-- Feature pills row -->
  <g transform="translate(480, 142)">
    <!-- AI Coding -->
    <rect width="72" height="20" rx="10" fill="#7aa2f7" opacity="0.1"/>
    <text x="36" y="14" font-family="sans-serif" font-size="9.5" fill="#7aa2f7" text-anchor="middle" font-weight="500">AI Coding</text>
    <!-- Multi-Provider -->
    <rect x="80" width="90" height="20" rx="10" fill="#bb9af7" opacity="0.1"/>
    <text x="125" y="14" font-family="sans-serif" font-size="9.5" fill="#bb9af7" text-anchor="middle" font-weight="500">Multi-Provider</text>
    <!-- Terminal UI -->
    <rect x="178" width="78" height="20" rx="10" fill="#7dcfff" opacity="0.1"/>
    <text x="217" y="14" font-family="sans-serif" font-size="9.5" fill="#7dcfff" text-anchor="middle" font-weight="500">Terminal UI</text>
  </g>

  <!-- Cursor indicator (static — no animate) -->
  <rect x="155" y="146" width="2" height="14" fill="#7aa2f7" opacity="0.8"/>

  <!-- Prompt line -->
  <text x="162" y="158" font-family="monospace" font-size="11" fill="#565f89">
    <tspan fill="#9ece6a">❯</tspan><tspan fill="#565f89"> cat --help</tspan>
  </text>
</svg>
