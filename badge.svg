<svg xmlns="http://www.w3.org/2000/svg" width="820" height="180" viewBox="0 0 820 180">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141525"/>
      <stop offset="50%" stop-color="#1a1b2e"/>
      <stop offset="100%" stop-color="#121320"/>
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7aa2f7"/>
      <stop offset="45%" stop-color="#bb9af7"/>
      <stop offset="75%" stop-color="#7dcfff"/>
      <stop offset="100%" stop-color="#9ece6a"/>
    </linearGradient>

    <!-- 3D Bevel CAT Face Gradient -->
    <linearGradient id="catGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93b5ff"/>
      <stop offset="40%" stop-color="#7aa2f7"/>
      <stop offset="85%" stop-color="#bb9af7"/>
      <stop offset="100%" stop-color="#7dcfff"/>
    </linearGradient>

    <!-- 3D Bevel Depth Shadow Gradient -->
    <linearGradient id="catDepth" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2c3258"/>
      <stop offset="100%" stop-color="#15172b"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Chassis with 3D Skeuomorphic Border -->
  <rect width="820" height="180" rx="16" ry="16" fill="url(#bg)"/>
  <rect x="0.75" y="0.75" width="818.5" height="178.5" rx="15.25" fill="none" stroke="#2e3148" stroke-width="1.5"/>
  <rect x="1.5" y="1.5" width="817" height="177" rx="14.5" fill="none" stroke="#10111a" stroke-width="1" opacity="0.6"/>

  <!-- Top Accent Neon Bar -->
  <rect x="0" y="0" width="820" height="3.5" rx="1.75" fill="url(#accent)" opacity="0.95"/>

  <!-- Terminal Window Controls (macOS 3D Style) -->
  <g transform="translate(24, 20)">
    <!-- Red Close -->
    <circle cx="0" cy="0" r="5.5" fill="#ff5f57"/>
    <circle cx="0" cy="0" r="5.5" fill="none" stroke="#e0443e" stroke-width="0.75"/>
    <circle cx="-1.5" cy="-1.5" r="1.5" fill="#ffffff" opacity="0.4"/>

    <!-- Yellow Minimize -->
    <circle cx="18" cy="0" r="5.5" fill="#febc2e"/>
    <circle cx="18" cy="0" r="5.5" fill="none" stroke="#d89e24" stroke-width="0.75"/>
    <circle cx="16.5" cy="-1.5" r="1.5" fill="#ffffff" opacity="0.4"/>

    <!-- Green Maximize -->
    <circle cx="36" cy="0" r="5.5" fill="#28c840"/>
    <circle cx="36" cy="0" r="5.5" fill="none" stroke="#1aab29" stroke-width="0.75"/>
    <circle cx="34.5" cy="-1.5" r="1.5" fill="#ffffff" opacity="0.4"/>
  </g>

 

  <!-- CAT 3D Vector Geometric Typography (Flawless on all platforms, zero ascii glitches) -->
  <g id="cat-vector-logo">
    <!-- Drop Shadow / 3D Extrusion Layer (depth 3px) -->
    <g fill="url(#catDepth)" opacity="0.85" transform="translate(3, 3)">
      <!-- C Depth -->
      <path d="M 215,62 H 182 C 168,62 158,72 158,86 V 104 C 158,118 168,128 182,128 H 215 V 114 H 184 C 177,114 172,109 172,102 V 88 C 172,81 177,76 184,76 H 215 Z"/>
      <!-- A Depth -->
      <path d="M 248,62 H 234 C 222,62 216,70 216,84 V 128 H 230 V 102 H 252 V 128 H 266 V 84 C 266,70 260,62 248,62 Z M 252,89 H 230 V 82 C 230,77 233,74 238,74 H 244 C 249,74 252,77 252,82 Z"/>
      <!-- T Depth -->
      <path d="M 270,62 H 322 V 76 H 303 V 128 H 289 V 76 H 270 Z"/>
    </g>

    <!-- Glowing Base Layer -->
    <g fill="url(#catGrad)" opacity="0.25" filter="url(#glow)">
      <!-- C Glow -->
      <path d="M 215,62 H 182 C 168,62 158,72 158,86 V 104 C 158,118 168,128 182,128 H 215 V 114 H 184 C 177,114 172,109 172,102 V 88 C 172,81 177,76 184,76 H 215 Z"/>
      <!-- A Glow -->
      <path d="M 248,62 H 234 C 222,62 216,70 216,84 V 128 H 230 V 102 H 252 V 128 H 266 V 84 C 266,70 260,62 248,62 Z M 252,89 H 230 V 82 C 230,77 233,74 238,74 H 244 C 249,74 252,77 252,82 Z"/>
      <!-- T Glow -->
      <path d="M 270,62 H 322 V 76 H 303 V 128 H 289 V 76 H 270 Z"/>
    </g>

    <!-- Front Face Layer (Gradient & Crisp Vector) -->
    <g fill="url(#catGrad)">
      <!-- C -->
      <path d="M 215,62 H 182 C 168,62 158,72 158,86 V 104 C 158,118 168,128 182,128 H 215 V 114 H 184 C 177,114 172,109 172,102 V 88 C 172,81 177,76 184,76 H 215 Z"/>
      <!-- A -->
      <path d="M 248,62 H 234 C 222,62 216,70 216,84 V 128 H 230 V 102 H 252 V 128 H 266 V 84 C 266,70 260,62 248,62 Z M 252,89 H 230 V 82 C 230,77 233,74 238,74 H 244 C 249,74 252,77 252,82 Z"/>
      <!-- T -->
      <path d="M 270,62 H 322 V 76 H 303 V 128 H 289 V 76 H 270 Z"/>
    </g>

    <!-- Skeuomorphic Top Highlight Edge (Emboss Effect) -->
    <g stroke="#ffffff" stroke-width="1" stroke-linecap="round" opacity="0.45">
      <!-- C Top Highlight -->
      <path d="M 182,63 H 214" fill="none"/>
      <!-- A Top Highlight -->
      <path d="M 234,63 H 248" fill="none"/>
      <!-- T Top Highlight -->
      <path d="M 271,63 H 321" fill="none"/>
    </g>

    <!-- Geometric Accents / Cyber Blocks -->
    <rect x="330" y="62" width="6" height="6" rx="1.5" fill="#7dcfff" opacity="0.8"/>
    <rect x="330" y="74" width="6" height="6" rx="1.5" fill="#bb9af7" opacity="0.6"/>
    <rect x="330" y="122" width="6" height="6" rx="1.5" fill="#7aa2f7" opacity="0.7"/>
  </g>

  <!-- Prompt Command Line under Logo -->
  <g transform="translate(158, 146)">
    <rect x="0" y="-12" width="180" height="22" rx="5" fill="#181a29" stroke="#25273a" stroke-width="0.8"/>
    <!-- Shell Prompt Symbol -->
    <text x="10" y="3" font-family="'Cascadia Code', 'Fira Code', 'Consolas', monospace" font-size="11.5" font-weight="700" fill="#9ece6a">❯</text>
    <text x="24" y="3" font-family="'Cascadia Code', 'Fira Code', 'Consolas', monospace" font-size="11.5" fill="#7aa2f7">cat</text>
    <text x="48" y="3" font-family="'Cascadia Code', 'Fira Code', 'Consolas', monospace" font-size="11.5" fill="#565f89">--help</text>
    <!-- Blinking Cursor -->
    <rect x="94" y="-8" width="6.5" height="13" rx="1" fill="#7dcfff" opacity="0.85"/>
  </g>

  <!-- Main Title with 3D Crisp Sans-Serif Typography -->
  <text x="460" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="28" font-weight="800" fill="#e0e5ff" letter-spacing="-0.4">
    Coding Agent Terminal
  </text>

  <!-- Subtitle -->
  <text x="460" y="91" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="500" fill="#6f79a8" letter-spacing="0.2">
    Terminal-first AI development environment
  </text>

  <!-- Version & Specification Badges (3D Skeuomorphic Pills) -->
  <g transform="translate(460, 108)">
    <!-- Version badge -->
    <g transform="translate(0, 0)">
      <rect width="80" height="23" rx="5" fill="#1e2034" stroke="#3b3f5c" stroke-width="1"/>
      <rect x="1" y="1" width="78" height="1" fill="#ffffff" opacity="0.1"/>
      <text x="40" y="15.5" font-family="'Cascadia Code', 'Fira Code', 'Consolas', monospace" font-size="11" font-weight="600" fill="#7aa2f7" text-anchor="middle">v0.8.0b1</text>
    </g>

    <!-- BETA tag -->
    <g transform="translate(88, 0)">
      <rect width="52" height="23" rx="5" fill="#2d224d" stroke="#bb9af7" stroke-width="1" opacity="0.85"/>
      <rect x="1" y="1" width="50" height="1" fill="#ffffff" opacity="0.15"/>
      <text x="26" y="15.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" fill="#d1b8ff" text-anchor="middle" letter-spacing="0.5">BETA</text>
    </g>

    <!-- Python badge -->
    <g transform="translate(148, 0)">
      <rect width="76" height="23" rx="5" fill="#1a2729" stroke="#2e5445" stroke-width="1"/>
      <rect x="1" y="1" width="74" height="1" fill="#ffffff" opacity="0.1"/>
      <text x="38" y="15.5" font-family="'Cascadia Code', 'Fira Code', 'Consolas', monospace" font-size="10.5" font-weight="600" fill="#9ece6a" text-anchor="middle">Py 3.10+</text>
    </g>

    <!-- MIT badge -->
    <g transform="translate(232, 0)">
      <rect width="50" height="23" rx="5" fill="#1c2438" stroke="#334b6b" stroke-width="1"/>
      <rect x="1" y="1" width="48" height="1" fill="#ffffff" opacity="0.1"/>
      <text x="25" y="15.5" font-family="'Cascadia Code', 'Fira Code', 'Consolas', monospace" font-size="10.5" font-weight="600" fill="#7dcfff" text-anchor="middle">MIT</text>
    </g>
  </g>

  <!-- Feature Pills Row (Tactile Embossed 3D Badges) -->
  <g transform="translate(460, 142)">
    <!-- AI Coding -->
    <g transform="translate(0, 0)">
      <rect width="78" height="21" rx="10.5" fill="#1e2342" stroke="#3a4575" stroke-width="0.8"/>
      <text x="39" y="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#7aa2f7" text-anchor="middle">AI Coding</text>
    </g>

    <!-- Multi-Provider -->
    <g transform="translate(86, 0)">
      <rect width="98" height="21" rx="10.5" fill="#291f42" stroke="#52397c" stroke-width="0.8"/>
      <text x="49" y="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#bb9af7" text-anchor="middle">Multi-Provider</text>
    </g>

    <!-- Terminal UI -->
    <g transform="translate(192, 0)">
      <rect width="88" height="21" rx="10.5" fill="#1a2a3d" stroke="#2d5272" stroke-width="0.8"/>
      <text x="44" y="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#7dcfff" text-anchor="middle">Terminal UI</text>
    </g>
  </g>
</svg>
