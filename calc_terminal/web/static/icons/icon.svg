<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#161b22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4aa"/>
      <stop offset="100%" style="stop-color:#00b894"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- Terminal window -->
  <rect x="60" y="100" width="392" height="312" rx="16" fill="#1c2129" stroke="#30363d" stroke-width="4"/>
  <!-- Title bar -->
  <rect x="60" y="100" width="392" height="48" rx="16" fill="#161b22"/>
  <rect x="60" y="132" width="392" height="16" fill="#161b22"/>
  <!-- Traffic lights -->
  <circle cx="92" cy="124" r="8" fill="#f85149"/>
  <circle cx="120" cy="124" r="8" fill="#d29922"/>
  <circle cx="148" cy="124" r="8" fill="#3fb950"/>
  <!-- Cat text -->
  <text x="256" y="280" text-anchor="middle" font-family="monospace" font-size="80" font-weight="bold" fill="url(#accent)">CAT</text>
  <!-- Cat ears -->
  <polygon points="140,88 160,40 180,88" fill="url(#accent)" opacity="0.9"/>
  <polygon points="332,88 352,40 372,88" fill="url(#accent)" opacity="0.9"/>
  <!-- Cursor blink -->
  <rect x="120" y="310" width="16" height="28" rx="3" fill="url(#accent)" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0;0.8" dur="1.2s" repeatCount="indefinite"/>
  </rect>
  <!-- FATTY CAT label -->
  <text x="256" y="460" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="700" fill="#00d4aa" letter-spacing="2">FATTY CAT</text>
</svg>
