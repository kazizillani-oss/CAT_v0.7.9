<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 640" width="100%" height="100%" style="background:#11121d; font-family:'JetBrains Mono', 'Fira Code', monospace;">
  <defs>
    <!-- 3D Bevel Gradients -->
    <linearGradient id="bevel-tall-card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a2e45"/>
      <stop offset="100%" stop-color="#181926"/>
    </linearGradient>
    <linearGradient id="menu-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#222538"/>
      <stop offset="100%" stop-color="#161824"/>
    </linearGradient>
    <linearGradient id="row-hover" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3b4261" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#2a2e45" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- Title & Status Header -->
  <text x="40" y="45" fill="#cdd6f4" font-size="20" font-weight="bold">CAT CLI v0.9.000 — Explorer Flush Layout &amp; Agent Context Menu Verification</text>
  <text x="40" y="70" fill="#a6adc8" font-size="13">Verified Single Scrollbar · Flush Bottom Expansion · Aria, Mira, Qala, Nova, Sage, Dex Retry Actions</text>

  <!-- Left: Sidebar Explorer Container -->
  <g transform="translate(40, 95)" filter="url(#card-shadow)">
    <!-- Explorer Frame (340px width, 500px height) -->
    <rect x="0" y="0" width="340" height="500" rx="4" fill="#181926" stroke="#3b4261" stroke-width="1.5"/>

    <!-- Explorer Titlebar -->
    <rect x="0" y="0" width="340" height="38" fill="#1e2030"/>
    <line x1="0" y1="38" x2="340" y2="38" stroke="#3b4261" stroke-width="1"/>
    <text x="16" y="24" fill="#cdd6f4" font-size="14" font-weight="bold">Explorer</text>
    <!-- Close cross button -->
    <rect x="306" y="8" width="22" height="22" rx="3" fill="#24273a" stroke="#494d64" stroke-width="1"/>
    <text x="313" y="24" fill="#a6adc8" font-size="13" font-weight="bold">✕</text>

    <!-- Open Folder Button (3D Tall Bevel) -->
    <g transform="translate(14, 50)">
      <rect x="0" y="0" width="312" height="32" rx="4" fill="#24273a" stroke="#585b70" stroke-width="1.5"/>
      <!-- Top highlight -->
      <line x1="2" y1="1" x2="310" y2="1" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1.5"/>
      <text x="96" y="21" fill="#f5c2e7" font-size="13" font-weight="bold">📁  Open Folder</text>
    </g>

    <!-- File Tree List Area (Single Scrollbar) -->
    <g transform="translate(14, 94)">
      <!-- Tree Guide Lines and Files -->
      <line x1="12" y1="12" x2="12" y2="280" stroke="#45475a" stroke-width="1.2" stroke-dasharray="2 2"/>
      
      <!-- Nodes -->
      <g transform="translate(0, 0)">
        <text x="24" y="16" fill="#89b4fa" font-size="12">📁  .cct</text>
      </g>
      <g transform="translate(0, 26)">
        <text x="24" y="16" fill="#cdd6f4" font-size="12">📄  .cct_profiles.json</text>
      </g>
      <g transform="translate(0, 52)">
        <text x="24" y="16" fill="#cdd6f4" font-size="12">📄  .cct_recent_projects.json</text>
      </g>
      <g transform="translate(0, 78)">
        <text x="24" y="16" fill="#cdd6f4" font-size="12">📄  .cct_requests.log</text>
      </g>
      <g transform="translate(0, 104)">
        <text x="24" y="16" fill="#cdd6f4" font-size="12">📄  .cct_session.json</text>
      </g>
      <g transform="translate(0, 130)">
        <text x="24" y="16" fill="#cdd6f4" font-size="12">📄  .cct_theme.json</text>
      </g>
      <g transform="translate(0, 156)">
        <text x="24" y="16" fill="#cdd6f4" font-size="12">📄  .cct_todos.json</text>
      </g>
      <g transform="translate(0, 182)">
        <text x="24" y="16" fill="#cdd6f4" font-size="12">📄  .cct_ui_layout.json</text>
      </g>
      <g transform="translate(0, 208)">
        <text x="24" y="16" fill="#cdd6f4" font-size="12">📄  chat_export_1789324875.md</text>
      </g>
      <g transform="translate(0, 234)">
        <text x="24" y="16" fill="#a6e3a1" font-size="12">📄  pyproject.toml</text>
      </g>
      <g transform="translate(0, 260)">
        <text x="24" y="16" fill="#fab387" font-size="12">📄  README.md</text>
      </g>

      <!-- EXACTLY ONE SINGLE SCROLLBAR (Blue Track & Thumb) -->
      <rect x="304" y="0" width="8" height="280" rx="4" fill="#1e2030"/>
      <rect x="305" y="24" width="6" height="78" rx="3" fill="#89b4fa"/>
    </g>

    <!-- Workspaces Footer Section (Flush at Bottom, No Dead Voids) -->
    <g transform="translate(0, 390)">
      <line x1="0" y1="0" x2="340" y2="0" stroke="#3b4261" stroke-width="1"/>
      <rect x="0" y="1" width="340" height="108" fill="#161824"/>
      <text x="16" y="22" fill="#89b4fa" font-size="12" font-weight="bold">Pinned &amp; Recent Workspaces</text>
      <g transform="translate(16, 34)">
        <text x="0" y="14" fill="#cdd6f4" font-size="12">📌  CAT_v0.7.9</text>
        <text x="290" y="14" fill="#f38ba8" font-size="12">✕</text>
      </g>
      <g transform="translate(16, 62)">
        <text x="0" y="14" fill="#a6adc8" font-size="12">📁  Dev_Project_PlayGround</text>
        <text x="290" y="14" fill="#6c7086" font-size="12">✕</text>
      </g>
      <!-- Flush bottom badge -->
      <rect x="16" y="86" width="308" height="18" rx="3" fill="#181926" stroke="#313244" stroke-width="1"/>
      <text x="75" y="99" fill="#a6e3a1" font-size="10">✓ Single Vertical Scrollbar · Flush Bottom</text>
    </g>
  </g>

  <!-- Right: Updated AI Response Context Menu -->
  <g transform="translate(430, 95)" filter="url(#card-shadow)">
    <!-- Menu Container (width: 40 cols -> 460px) -->
    <rect x="0" y="0" width="460" height="390" rx="6" fill="url(#menu-bg)" stroke="#585b70" stroke-width="2"/>
    <!-- Top 3D Luminous Bevel -->
    <line x1="2" y1="1" x2="458" y2="1" stroke="#ffffff" stroke-opacity="0.35" stroke-width="2"/>
    <line x1="1" y1="1" x2="1" y2="388" stroke="#ffffff" stroke-opacity="0.25" stroke-width="2"/>
    <line x1="0" y1="389" x2="460" y2="389" stroke="#000000" stroke-opacity="0.6" stroke-width="2"/>

    <!-- Header / Copy Row (Focused/Hovered) -->
    <g transform="translate(0, 10)">
      <rect x="4" y="0" width="452" height="32" rx="3" fill="url(#row-hover)"/>
      <line x1="4" y1="0" x2="4" y2="32" stroke="#cba6f7" stroke-width="4"/>
      <text x="20" y="21" fill="#cba6f7" font-size="14" font-weight="bold">📋  Copy Text</text>
    </g>

    <!-- Summarize -->
    <g transform="translate(0, 44)">
      <text x="20" y="21" fill="#cdd6f4" font-size="14">📜  Summarize Full Chat</text>
    </g>

    <!-- New Session -->
    <g transform="translate(0, 78)">
      <text x="20" y="21" fill="#cdd6f4" font-size="14">➕  New Chat Session</text>
    </g>

    <!-- Divider -->
    <line x1="16" y1="116" x2="444" y2="116" stroke="#45475a" stroke-width="1"/>

    <!-- Retry in Aria (Build) -->
    <g transform="translate(0, 122)">
      <rect x="4" y="0" width="452" height="32" rx="3" fill="#1e2030"/>
      <text x="20" y="21" fill="#89b4fa" font-size="14" font-weight="bold">🔄  Try Again in Aria (Build)</text>
      <text x="350" y="21" fill="#6c7086" font-size="11">Code Builder</text>
    </g>

    <!-- Retry in Mira (Plan Mode) -->
    <g transform="translate(0, 158)">
      <text x="20" y="21" fill="#cdd6f4" font-size="14">🔄  Try Again in Mira (Plan Mode)</text>
      <text x="350" y="21" fill="#6c7086" font-size="11">Architect</text>
    </g>

    <!-- Retry in Qala (Notebook) -->
    <g transform="translate(0, 194)">
      <text x="20" y="21" fill="#cdd6f4" font-size="14">🔄  Try Again in Qala (Notebook)</text>
      <text x="350" y="21" fill="#6c7086" font-size="11">Data Science</text>
    </g>

    <!-- Retry in Nova (Agent) -->
    <g transform="translate(0, 230)">
      <text x="20" y="21" fill="#cdd6f4" font-size="14">🔄  Try Again in Nova (Agent)</text>
      <text x="350" y="21" fill="#6c7086" font-size="11">Autonomous</text>
    </g>

    <!-- Retry in Sage (Research) -->
    <g transform="translate(0, 266)">
      <text x="20" y="21" fill="#cdd6f4" font-size="14">🔄  Try Again in Sage (Research)</text>
      <text x="350" y="21" fill="#6c7086" font-size="11">Deep Search</text>
    </g>

    <!-- Retry in Dex (Debugger) -->
    <g transform="translate(0, 302)">
      <text x="20" y="21" fill="#cdd6f4" font-size="14">🔄  Try Again in Dex (Debugger)</text>
      <text x="350" y="21" fill="#6c7086" font-size="11">Diagnosis</text>
    </g>

    <!-- Footer info -->
    <rect x="0" y="344" width="460" height="46" rx="4" fill="#181926"/>
    <line x1="0" y1="344" x2="460" y2="344" stroke="#313244" stroke-width="1"/>
    <text x="20" y="372" fill="#a6e3a1" font-size="12">✓ MENU_WIDTH: 40 cols · No Truncation · All Agent Personas Aligned</text>
  </g>

  <!-- Bottom Explanatory Card -->
  <g transform="translate(430, 510)" filter="url(#card-shadow)">
    <rect x="0" y="0" width="630" height="85" rx="6" fill="#181926" stroke="#3b4261" stroke-width="1"/>
    <text x="20" y="28" fill="#f9e2af" font-size="13" font-weight="bold">Core Issues Resolved &amp; Crash Resiliency</text>
    <text x="20" y="48" fill="#cdd6f4" font-size="12">1. Double scrollbar eliminated: only Tree handles vertical overflow; body container hidden overflow.</text>
    <text x="20" y="66" fill="#cdd6f4" font-size="12">2. Empty sidebar space eliminated: Tree flexes height: 1fr with 0 min-height flush to projects.</text>
    <text x="20" y="82" fill="#cdd6f4" font-size="12" fill-opacity="0.8">3. Response crash resolved: fixed NoneType format bug in thinking.py completion summary.</text>
  </g>
</svg>

